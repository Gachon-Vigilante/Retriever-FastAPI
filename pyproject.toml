[project]
name = "retriever-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.13.4",
    "celery>=5.3",
    "celery-types>=0.23.0",
    "dotenv>=0.9.9",
    "fastapi>=0.116.1",
    "flower>=2.0.1",
    "google-genai>=1.30.0",
    "kombu>=5.5.4",
    "langchain-google-genai>=2.1.9",
    "lxml>=6.0.0",
    "pydantic>=2.0.0",
    "pymongo>=4.14.0",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.4",
    "sqlalchemy>=2.0.42",
    "telethon>=1.40.0",
    "uvicorn[standard]>=0.35.0",
    "neomodel>=5.5.3",
    "pytest",
    "langchain-core>=0.3.79",
    "langchain-text-splitters>=0.3.11",
    "langchain-huggingface>=0.3.1",
    "langgraph>=1.0.0",
    "langchain<1.0.0",
    "langchain-tools>=0.1.34",
    "weaviate-client>=4.17.0",
    "langchain-weaviate>=0.0.5",
    "langchain-community>=0.3.31",
    "langgraph-checkpoint-mongodb>=0.2.1",
    "motor>=3.7.1", # needed in `from langchain_community.document_loaders import MongodbLoader`
    "oci>=2.161.1",
    "serpapi>=0.1.5",
]

[project.optional-dependencies]
# FastAPI 서비스에만 필요한 패키지
fastapi = [
]

# AI 모듈 등 무거운 패키지가 필요한 Celery 워커 그룹
ai_worker = [
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "sentencepiece",
    "hdbscan",
    "matplotlib",
    "torch",
    "transformers",
    "umap-learn",
]

[tool.setuptools.packages.find]
# 프로젝트 루트 디렉토리('.')에서 패키지를 찾도록 지정합니다.
where = ["."]
# 오류 메시지에 나온 디렉토리 중 실제 패키지에 포함되어야 할 것들만 명시합니다.
# 'logs'와 같이 패키지에 포함되면 안 되는 디렉토리는 제외합니다.
include = [
    "clustering*",
    "core*",
    "crawlers*",
    "genai*",
    "handlers*",
    "routes*",
    "tasks*",
    "teleprobe*",
    "celery_app*" # celery_app.py가 있다면 celery_app*도 추가
]
# exclude를 사용하여 특정 파일을 제외할 수도 있습니다.
# exclude = ["tests*"]