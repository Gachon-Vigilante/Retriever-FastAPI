name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fastapi-app:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.docker_tags.outputs.build_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv

      - name: Log in to OCIR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_PASSWORD }}

      - name: Set Docker image tags
        id: docker_tags
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          BUILD_VERSION=${{ github.run_number }}-${SHORT_SHA}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "base_tag=latest" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "base_tag=dev" >> $GITHUB_OUTPUT
          else
            echo "base_tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "build_version=$BUILD_VERSION" >> $GITHUB_OUTPUT

      - name: Build and push fastapi-app image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          target: fastapi-app
          push: true
          platforms: linux/arm64,linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.REGISTRY_PREFIX }}/retriever-fastapi:${{ steps.docker_tags.outputs.base_tag }}
            ${{ secrets.REGISTRY_PREFIX }}/retriever-fastapi:${{ steps.docker_tags.outputs.build_version }}

