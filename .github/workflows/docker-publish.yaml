  sync-infra:
#    needs: [build-fastapi-app, build-celery-base-worker, build-celery-ai-worker]
    needs: build-fastapi-app
    runs-on: ubuntu-latest
    steps:
      - name: Update infra repo deployments
        env:
          K8S_REPO_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          BUILD_VERSION: ${{ needs.build-celery-ai-worker.outputs.build_version }}
          REGISTRY_PREFIX: ${{ secrets.REGISTRY_PREFIX }}
        run: |
          git clone --single-branch --branch main https://x-access-token:${K8S_REPO_TOKEN}@github.com/Gachon-Vigilante/Retriever-INFRA.git
          cd Retriever-INFRA

          deployments=(
            "production/fastapi/deployment.yaml,retriever-fastapi"
#            "async/celery/beat-deployment.yaml,retriever-celery-base-worker"
#            "async/celery/worker-analyze-deployment.yaml,retriever-celery-base-worker"
#            "async/celery/worker-crawl-deployment.yaml,retriever-celery-base-worker"
#            "async/celery/worker-poll-deployment.yaml,retriever-celery-base-worker"
#            "async/celery/worker-search-deployment.yaml,retriever-celery-base-worker"
#            "async/celery/worker-telegram-deployment.yaml,retriever-celery-base-worker"
#            "async/celery/worker-ai-deployment.yaml,retriever-celery-ai-worker"
          )

          for item in "${deployments[@]}"; do
            IFS=',' read -r file image_name <<< "$item"
            image="${REGISTRY_PREFIX}/${image_name}:${BUILD_VERSION}"
            if [[ -f "$file" ]]; then
              sed -i "s|image:.*|image: $image|g" "$file"
            else
              echo "Deployment file $file not found. Skipping update."
            fi
          done

          git config user.name "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Chore: Fast API 이미지 업데이트 - ${BUILD_VERSION} (from ${GITHUB_REPOSITORY}:${GITHUB_REF##*/})"
            git push https://x-access-token:${K8S_REPO_TOKEN}@github.com/Gachon-Vigilante/Retriever-INFRA.git
          else
            echo "No changes to deployment files."
          fi
